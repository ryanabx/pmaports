# Feed the hardware watchdog from systemd, so a hung kernel or PID 1 resets
# the stick into whatever `boot` holds instead of staying hung until someone
# pulls the power (it has no reset button). 30 s: the TOPRGU allows 31 at most.
#
# The pretimeout must be set too. With the watchdog interrupt in the DT,
# mtk-wdt runs in dual mode with a pretimeout of timeout/2 (its default,
# and the only value it accepts), so the panic governor fires 15 s after a
# ping; told nothing, systemd pings every timeout/2, also 15 s, and the
# stick panicked 89 s into the first boot (2026-11-20). Told the pretimeout,
# systemd pings within (timeout - pretimeout)/2.
[Manager]
RuntimeWatchdogSec=30s
RuntimeWatchdogPreSec=15s
