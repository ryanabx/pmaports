# systemd user drop-in for plasma-plasmashell.service
# (/usr/lib/systemd/user/plasma-plasmashell.service.d/lowmem.conf):
# GPU memory is pinned and scarce on the stick. Measured 2026-11-11:
# 103 -> 78 MiB of GPU memory, the home screen within 2/255 per channel.
# - No depth/stencil buffer: Qt asks for D24S8, which this GPU can't
#   offer, so it became a 16 MiB D32S8 buffer for the 1920x1080 window;
#   Qt Quick then orders batches without depth, and loses only stencil
#   clipping of non-rectangular clips.
# - A 1024x1024 texture atlas instead of Qt's 2048x2048 (16 MiB).
[Service]
Environment=QSG_NO_DEPTH_BUFFER=1 QSG_NO_STENCIL_BUFFER=1
Environment=QSG_ATLAS_WIDTH=1024 QSG_ATLAS_HEIGHT=1024
