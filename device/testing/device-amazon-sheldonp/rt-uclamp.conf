# Real-time tasks (the Wi-Fi driver's SDIO worker, KWin's compositor thread)
# no longer force the CPU to its top OPP whenever they run. Without this,
# schedutil raised the idle CPU to 1690 MHz at 1.1 V about 30 times a
# second for the Wi-Fi worker alone, each change an I2C write to the
# MT6393. Measured on the stick: idle time at 754 MHz 77% -> 99.6%, with
# vkcube and Wi-Fi throughput unchanged. Needs CONFIG_UCLAMP_TASK
# (linux-amazon-sheldonp r4); the "-" skips it on kernels without it.
-kernel.sched_util_clamp_min_rt_default = 0
