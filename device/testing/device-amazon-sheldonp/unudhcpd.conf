# The USB network's addresses: sheldon is 172.16.44.1 and gives the host
# 172.16.44.2, not postmarketOS's 172.16.42.1 and .2, so it can be plugged
# into one host next to amazon-suez (172.16.43.1) and any other
# postmarketOS device. The initramfs sources the lowercase names; systemd's
# unudhcpd@.service reads the uppercase ones (EnvironmentFile). OpenRC's
# unudhcpd reads unudhcpd.confd.
unudhcpd_host_ip=172.16.44.1
unudhcpd_client_ip=172.16.44.2
UNUDHCPD_SERVER=172.16.44.1
UNUDHCPD_CLIENT=172.16.44.2
