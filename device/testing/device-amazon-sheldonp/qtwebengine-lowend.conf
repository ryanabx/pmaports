# systemd environment.d (/usr/lib/environment.d/60-qtwebengine-lowend.conf):
# QtWebEngine apps (Jellyfin, Aura) in Chromium's low-end device mode, as
# Chromium itself does on devices with <= 1 GiB. Measured 2026-11-12 on
# Aura's home page: RSS 95 -> 61 MiB, renderers 49 -> 28 MiB, GPU memory
# unchanged. Costs: lower-resolution tiles while scrolling, less caching.
# Applies to apps started after the next login; a user's own
# QTWEBENGINE_CHROMIUM_FLAGS (~/.config/environment.d) replaces it.
QTWEBENGINE_CHROMIUM_FLAGS=--enable-low-end-device-mode
