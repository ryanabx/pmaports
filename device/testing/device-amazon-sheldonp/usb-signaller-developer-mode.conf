# usb-signaller-developer-mode sets the USB network's address to
# 172.16.42.1 in NetworkManager, with no setting to change it; sheldon's is
# 172.16.44.1 (see /etc/unudhcpd.conf). Run the same script with the
# addresses swapped.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'sed "s/172\\.16\\.42\\./172.16.44./g" /usr/bin/usb-signaller-developer-mode | sh -s up'
ExecStop=
ExecStop=/bin/sh -c 'sed "s/172\\.16\\.42\\./172.16.44./g" /usr/bin/usb-signaller-developer-mode | sh -s down'
