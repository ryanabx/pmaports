# Render GTK 4 apps on the GPU, with GSK's GL renderer (GLES 3.1 on zink).
#
# Needs the amazon-suez Mesa fork (pmaports temp/mesa, 27.0.0_git20261104):
# with Mesa 26.2.3, zink offered only GLES 2.0 here and GTK 4 fell back
# slowly to Vulkan, so this file used to say cairo (2026-10-08). On the fork,
# measured 2026-11-04 on phosh: gnome-calculator's first frame renders
# correctly under GL; launch 1.3-1.9 s with a warm pipeline cache against
# 1.0 s for cairo; phoc's CPU per text-editor scroll halves (no shm uploads).
# GTK 4's Vulkan renderer also works but launches in 3-7 s (its render-pass
# pipelines are not cached yet), so GL it is.
#
# GTK 3 (phosh itself) draws with cairo and does not read this. Override per
# app with GSK_RENDERER=cairo or vulkan.
#
# Keep in sync with suez-gtk-renderer.conf and the post-install script, as
# with 50-powervr-vulkan.conf. Evidence: suez-work
# notes/PVR-DESKTOP-2026-11-04.md.
GSK_RENDERER=ngl
