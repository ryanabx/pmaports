# Render GTK 4 apps with cairo (on the CPU) rather than GSK's GPU renderers.
#
# On this board GTK 4 starts slowly on the GPU: it creates a Vulkan device and
# rejects it ("no dmabuf support"), then tries GL on zink, which offers only
# GLES 2.0 here, then falls back to Vulkan with an empty pipeline cache, so
# every start compiles every pipeline. Measured 2026-10-08 on phosh, kernel
# without lock debugging, Mesa 26.2.3, GTK 4.22: gnome-calculator reaches its
# first frame in 1.0-1.3 s with cairo against 4.8-7.3 s by default, and a
# gnome-text-editor fling shows 79-110 frames against 69-76. The cost moves
# into the compositor, which uploads the shm buffers.
#
# GTK 3 (phosh itself) already draws with cairo and does not read this.
# Override per app with GSK_RENDERER=vulkan or ngl. Revisit when Mesa's
# PowerVR driver or GTK changes.
#
# Keep in sync with suez-gtk-renderer.conf and the post-install script, as
# with 50-powervr-vulkan.conf.
GSK_RENDERER=cairo
