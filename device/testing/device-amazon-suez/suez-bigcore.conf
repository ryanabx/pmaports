# amazon-suez: run the user's phoc on the two Cortex-A72s (cpu2-3).
# Measured 2026-11-10 (6 interleaved rounds of the panel gesture): phoc
# alone pinned gives 145 frames per gesture pair vs 134 free and phoc CPU
# 1.09 vs 1.43 s; pinning phosh as well adds nothing, and would pin every
# app phosh launches, since they inherit its mask. No idle cost (11-08).
# phoc starts before this unit (it runs gnome-session), so pin it here; its
# later threads inherit the mask.
[Service]
ExecStartPre=-/bin/sh -c 'for p in $$(pgrep -u %U -x phoc); do taskset -a -p c "$$p" >/dev/null; done'
