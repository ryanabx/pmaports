# amazon-suez: run phosh, and the phoc it draws through, on the two
# Cortex-A72s (cpu2-3). Measured 2026-11-04 and 11-08: worst panel frame
# gap 48 vs 64-96 ms, phoc CPU per gesture 0.80 vs 0.95 s, no cost at idle,
# +14 mA under non-stop gestures. phoc starts before this unit (it runs
# gnome-session), so pin the user's running phoc here; its later threads
# inherit the mask. Apps keep the full CPU set.
[Service]
CPUAffinity=2-3
ExecStartPre=-/bin/sh -c 'for p in $$(pgrep -u %U -x phoc); do taskset -a -p c "$$p" >/dev/null; done'
