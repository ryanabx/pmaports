# Hand the hardware watchdog to PID 1.
#
# Without this the kernel pings the watchdog by itself forever (mtk_wdt comes
# out of LK already running, and CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED keeps it
# fed from a kthread). That does rescue a fully dead kernel -- proven: a
# sysrq-c panic reset the board unattended in 76 s -- but it cannot rescue a
# kernel that is still scheduling while userspace is gone, which is exactly
# the profile of this board's stochastic early-boot wedge. Letting systemd
# own the pings turns "PID 1 stopped making progress" into a reset too.
#
# 20 s because mtk_wdt caps max_timeout at 31 s; asking for more makes the
# WDIOC_SETTIMEOUT ioctl fail and systemd falls back to not arming it at all.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=20s
