# Reboot a boot that has not reached multi-user.target after five minutes.
#
# The hardware watchdog only resets a board whose PID 1 stops feeding it. A
# boot that stalls with PID 1 alive (on 2026-10-24 one showed nothing for
# 87 s, with the journal stopped at 8.6 s and no reset, until it was switched
# off) would otherwise sit there for good, and without a display or the UART
# nothing outside can see it. A reboot turns it into one of the boots U-Boot
# counts (suez-boot-ok). A normal boot reaches multi-user.target 16-18 s
# after the kernel starts.
#
# reboot-force skips the orderly stop; if even that hangs, the reboot
# watchdog (suez-watchdog.conf) resets the board 20 s later.
[Unit]
JobTimeoutSec=5min
JobTimeoutAction=reboot-force
