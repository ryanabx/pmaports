# Qt Quick's glyph and image atlas at 1024x1024 instead of Qt's default
# 2048x2048 on this GPU.
#
# Every Qt Quick process keeps its own atlas texture in pinned GPU memory
# (the GX6250 has no dedicated VRAM; pvr buffers are shmem). The idle Plasma
# Mobile session has four Qt Quick processes: KWin, plasmashell,
# plasma-keyboard and the lock screen. Measured 2026-11-18, the idle session
# at the lock screen: Shmem medians 377.6 MB (default, 3 boots) vs 323.6 MB
# (1024, 6 boots), about 54 MB or 13 MB per process, and each Qt Quick app
# saves its own share on top. One of the six 1024 boots stayed at 380.9 MB,
# unexplained. Text and icons checked by eye by Ryan the same day: no
# missing or wrong glyphs. A full atlas grows a second one, so nothing is
# lost but a little packing efficiency.
#
# Only environment.d: Plasma Mobile's session (KWin, plasmashell and the
# rest, started under the systemd user manager) reads it; measured
# 2026-11-18 in all four processes' environments. Phosh's greetd path does
# not, and has no Qt Quick processes to need it. Evidence: suez-work
# notes/MEMORY-2026-11-18.md section 2.
QSG_ATLAS_WIDTH=1024
QSG_ATLAS_HEIGHT=1024
