# The system-manager half of the PowerVR Vulkan conformance gate; see the
# comments in 50-powervr-vulkan.conf (installed into /usr/lib/environment.d)
# for what the variable does and why the GPU is unusable without it.
#
# This half exists because a compositor does not have to be a user unit.
# Plasma Mobile on postmarketOS runs as plasma-mobile.service -- a *system*
# service that merely drops to the user's uid -- and system services do not
# read environment.d. Display managers (sddm.service, gdm.service) are system
# services too. DefaultEnvironment= is the one placement that reaches all of
# them without naming any single desktop's unit, and it is inherited by
# user@UID.service as well.
#
# The variable is read only by Mesa's pvr Vulkan driver, so setting it
# system-wide is inert for everything else on the image.
[Manager]
DefaultEnvironment="PVR_I_WANT_A_BROKEN_VULKAN_DRIVER=1"
