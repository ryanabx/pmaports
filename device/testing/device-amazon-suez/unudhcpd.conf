# The USB network's addresses: suez is 172.16.43.1 and gives the host
# 172.16.43.2, not postmarketOS's 172.16.42.1 and .2. Two devices on the same
# subnet give the host two routes to it, and only one is reachable, so each
# device plugged into one host at the same time needs a subnet of its own;
# 172.16.42.x stays free for any other postmarketOS device.
#
# The initramfs reads the lower-case pair, unudhcpd@.service and
# suez-usb-developer-mode the upper-case one.
unudhcpd_host_ip=172.16.43.1
unudhcpd_client_ip=172.16.43.2
UNUDHCPD_SERVER=172.16.43.1
UNUDHCPD_CLIENT=172.16.43.2
