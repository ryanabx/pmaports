# Let systemd-oomd kill a runaway app before the whole board thrashes.
#
# On this 2 GB tablet an app that holds more memory than fits and keeps
# touching it does not get OOM-killed: the board stalls for 10-13 s at a
# time instead (KWin and plasmashell too), close to the 20 s hardware
# watchdog. systemd's default for app.slice (50 % for 30 s) never fires,
# because the app's own cgroup sees only about half of the system's
# pressure. With 20 % for 10 s, oomd killed a 1300 MiB test hog after 26 s,
# while normal browser video stayed at 0-2 % pressure (suez-work
# notes/MEMORY-2026-11-17.md section 4).
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=20%
ManagedOOMMemoryPressureDurationSec=10s
