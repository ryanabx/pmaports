# UCM for the Amazon Fire HD 10 (2017) mainline audio card (mt8173-mt6391).
#
# For the DAPM MT6391 codec with ACCDET headset detection (the series
# b4/rbrue-suez-upstreaming-mt6391-codec; kernel 7.4.0_rc2-r4 and later).
#
# The card is DPCM: the front-end PCMs cannot even be opened until the
# FE->BE mixer routes are enabled ("ASoC: no backend DAIs enabled"), and
# every switch powers up off. The verb turns on the digital routing; the
# devices select the outputs and set the analog gain. The codec powers its
# amplifiers itself, through DAPM, while a stream runs to an enabled output.
#
# Capture ingress is O09/O10 <- I17/I18, NOT I03/I04. Both pairs are offered
# by mt8173-afe-pcm.c as sources for "I2S Capture", but on this SoC only
# I17/I18 actually carries the external I2S stream -- I03/I04 is the internal
# ADC, i.e. the PMIC's own ADDA. Measured: with I03/I04 the VUL memif reads
# exact digital zero forever even though the whole DAPM chain powers up and
# the RT5514 is demonstrably driving its data pin; with I17/I18 the same
# setup captures audio.

SectionVerb {
	EnableSequence [
		cset "name='O03 I05 Switch' on"
		cset "name='O04 I06 Switch' on"
		cset "name='O09 I17 Switch' on"
		cset "name='O10 I18 Switch' on"
	]

	DisableSequence [
		cset "name='O03 I05 Switch' off"
		cset "name='O04 I06 Switch' off"
		cset "name='O09 I17 Switch' off"
		cset "name='O10 I18 Switch' off"
	]

	Value {
		TQ "HiFi"
	}
}

# "Speaker Volume" powers on at 0, which is mute, exactly as the old
# Speaker_PGAL/PGAR_GAIN did at 'Mute', so the device must set it. Step 8 is
# +10 dB, the old '10Db' item: the loudest step measured before distortion
# climbs (recording the speaker through the internal mic, the second harmonic
# sits near 3% of the fundamental at 0Db/8Db/10Db and roughly doubles at
# 13Db). The analog gain stays fixed; no PlaybackVolume is declared, so the
# desktop volume stays in software, as before.
#
# "Headphone Switch" follows the jack (the machine driver ties the Headphone
# pin to it), so it comes on by itself when headphones are plugged in. It is
# set off here so that choosing the speaker with headphones in does not also
# power the headphone amplifier on every stream.
SectionDevice."Speaker" {
	Comment "Internal speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Headphone Switch' off"
		cset "name='Speaker Volume' 8"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Volume' 0"
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# The 3.5 mm jack. The MT6397's ACCDET detects a plug (headset or three-pole
# headphones) and the machine driver reports it as "Headphone Jack", so the
# port is offered only while something is plugged in, and its priority is
# above the speaker's so that plugging in moves playback there.
#
# There is no headset microphone device: the codec driver has no capture
# path (the MT6397's ADC is not driven), so a headset's microphone is
# detected but not usable. The internal microphone is on the RT5514 (below).
#
# "Headphone Volume" runs 0..13: 0 is -40 dB, 1..13 are -4 dB..+8 dB in 1 dB
# steps (the PMIC's ZCD_CON2 PGA). Step 1 (-4 dB), the quietest step above the
# -40 dB floor, is the level chosen by listening (2026-11-12): already the
# loudest wanted for music at full desktop volume. As for the speaker, no
# PlaybackVolume: the desktop volume stays in software.
SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Speaker Volume' 0"
		cset "name='Headphone Volume' 1"
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
		cset "name='Headphone Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

# The microphone is an ANALOG part on the RT5514's AMICL input, reached over
# I2S2 -- not a PDM mic on the RT5514's DMIC pins, and not on the MT6397 at
# all. Selecting either DMIC pair leaves the down filter fed by a constant
# (only its dither, +-1 LSB, comes out, and it scales with gain rather than
# with sound), while the analog leg tracks a tone played on the speakers.
#
# Only the left half is enabled: AMICR is unpopulated. It has the same noise
# floor as AMICL but shows no acoustic response at any boost setting, so
# turning it on would buy a channel of hiss. With it off the right channel is
# digital silence and the device declares itself mono.
SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='Sto1 ADC MIXL ADC Switch' on"
		cset "name='MIC Boost Volume' 6"
	]

	DisableSequence [
		cset "name='Sto1 ADC MIXL ADC Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureRate 48000
		CaptureChannels 1
	}
}
