# Stop logind taking an idle action. This is only half the job -- see the
# APKBUILD, which also masks the sleep targets, and the note below on why that
# masking is the part that actually works.
#
# Why any of this: a FAILED suspend on this board is destructive, not merely
# useless. Measured on 7.1.8-r75 and 7.2.2, reproducible at 900 s of idle on
# every boot: an s2idle attempt cannot complete -- mtu3 returns -EBUSY while the
# USB gadget is up, and the MT6630 SDIO functions declare no PM ops at all
# (WARNING drivers/mmc/core/sdio.c:1048, "missing suspend/resume ops for
# non-removable SDIO card") -- and the resume that runs after the abort
# re-initialises the SDIO card underneath the driver. What comes back is a dead
# chip: wlan0 goes DOWN and refuses to come up ("RTNETLINK answers: Not
# supported"), mac80211 throws WARNING net/mac80211/util.c:2012 with
# wiphy_resume returning -EINVAL, and hci0 fails every command. Neither Wi-Fi
# nor Bluetooth recovers without a reboot. The eMMC re-tunes fine.
#
# On this unit the requester was gnome-shell's own power manager, not logind and
# not the lid, so suez-lid.conf alone was never enough.
#
# DO NOT reach for logind's SleepOperation= here. It looks like exactly the right
# knob and it is a real key (it is in logind's gperf table and logs no parse
# warning), but on systemd 261.2 an empty SleepOperation= does NOT gate suspend:
# measured, CanSuspend still answers "yes". Revision 35 of this package shipped
# that and was ineffective. Masking the targets is what works -- with the masks
# in place CanSuspend answers "no".
#
# Verify with, and only with:
#   busctl call org.freedesktop.login1 /org/freedesktop/login1 \
#          org.freedesktop.login1.Manager CanSuspend
# It must answer "no". Checking `systemctl suspend` is useless over SSH, because
# sshd itself holds a block inhibitor ("Active PAM session") and the call is
# refused for that reason instead, which looks like success but proves nothing.
#
# Delete this file, and the masks, when suspend is demonstrated to work. Not before.
[Login]
IdleAction=ignore
