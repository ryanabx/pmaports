# Stop logind taking an idle action. This is only half the job -- see the
# APKBUILD, which also masks the sleep targets, and the note below on why that
# masking is the part that actually works.
#
# WHY THIS IS STILL HERE NOW THAT SUSPEND WORKS
#
# Read this before deleting it: the original reason is gone and has been
# replaced by a narrower one. Until 7.2.2-r12 a suspend attempt on this board
# could not complete at all -- there was no platform_suspend_ops (Amazon's
# firmware is PSCI 0.2, SYSTEM_SUSPEND is PSCI 1.0), so s2idle was the only
# state, and mtk_vpu aborted even that with -EIO. As of r12 suspend-to-RAM
# genuinely works, driven by the SPM, with nothing quiesced:
#
#   state write rc=0, uptime 111.46 -> 125.50
#   mtk-spm-suspend ...: woke by PCM_TIMER, slept 327858 ticks   (= 10.005 s)
#
# What has NOT been fixed is the MT6630. Both its SDIO functions are plain
# struct sdio_driver with no .drv.pm, so the core WARNs on the way down
# (drivers/mmc/core/sdio.c:1048, "missing suspend/resume ops for non-removable
# SDIO card") and the resume re-initialises the card underneath the driver.
# What comes back is a dead chip: wiphy_resume returns -EINVAL, wlan0 refuses to
# come up ("RTNETLINK answers: Not supported"), and hci0 fails every command.
# Neither Wi-Fi nor Bluetooth recovers without a reboot. The eMMC re-tunes fine.
#
# So the trade is no longer "a suspend that fails" against "no suspend"; it is
# "a suspend that works but permanently kills networking until reboot" against
# "no suspend". A tablet that loses Wi-Fi and Bluetooth because the user closed
# the lid is worse than one whose power menu has no Suspend entry, so the block
# stays. On this unit the requester was gnome-shell's own power manager, not
# logind and not the lid, so suez-lid.conf alone was never enough.
#
# THE CONDITION FOR REMOVING THIS FILE AND THE MASKS
#
# PM ops for the two MT6630 SDIO functions. The firmware is downloaded at
# runtime, so resume is not a register restore -- it means re-running the whole
# bring-up and then ieee80211_restart_hw(). Notes in ~/suez-work/MT6630-WIFI-DESIGN.md.
# Nothing else is outstanding: the VPU is disabled in the board dts, and mtu3's
# -EBUSY only ever applied to a connected USB *host*, i.e. this dev rig, which is
# correct upstream behaviour and must not be "fixed".
#
# DO NOT reach for logind's SleepOperation= here. It looks like exactly the right
# knob and it is a real key (it is in logind's gperf table and logs no parse
# warning), but on systemd 261.2 an empty SleepOperation= does NOT gate suspend:
# measured, CanSuspend still answers "yes". Revision 35 of this package shipped
# that and was ineffective. Masking the targets is what works -- with the masks
# in place CanSuspend answers "no".
#
# Verify with, and only with:
#   busctl call org.freedesktop.login1 /org/freedesktop/login1 \
#          org.freedesktop.login1.Manager CanSuspend
# It must answer "no". Checking `systemctl suspend` is useless over SSH, because
# sshd itself holds a block inhibitor ("Active PAM session") and the call is
# refused for that reason instead, which looks like success but proves nothing.
[Login]
IdleAction=ignore
