# UCM for the Amazon Fire HD 10 (2017) mainline audio card (mt8173-mt6391).
#
# The card is DPCM: the front-end PCMs cannot even be opened until the
# FE->BE mixer routes are enabled ("ASoC: no backend DAIs enabled"), and
# every switch powers up off. The verb turns on the digital routing; the
# devices toggle the analog stages (Class-D speaker amp, mic preamps+ADCs).

SectionVerb {
	EnableSequence [
		cset "name='O03 I05 Switch' on"
		cset "name='O04 I06 Switch' on"
		cset "name='O09 I03 Switch' on"
		cset "name='O10 I04 Switch' on"
	]

	DisableSequence [
		cset "name='O03 I05 Switch' off"
		cset "name='O04 I06 Switch' off"
		cset "name='O09 I03 Switch' off"
		cset "name='O10 I04 Switch' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"

	EnableSequence [
		cset "name='Speaker_Amp_Switch' On"
	]

	DisableSequence [
		cset "name='Speaker_Amp_Switch' Off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='Audio_Preamp1_Switch' AIN1"
		cset "name='Audio_Preamp2_Switch' AIN2"
		cset "name='Audio_ADC_1_Switch' On"
		cset "name='Audio_ADC_2_Switch' On"
	]

	DisableSequence [
		cset "name='Audio_ADC_1_Switch' Off"
		cset "name='Audio_ADC_2_Switch' Off"
		cset "name='Audio_Preamp1_Switch' OPEN"
		cset "name='Audio_Preamp2_Switch' OPEN"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureRate 48000
		CaptureChannels 2
	}
}
