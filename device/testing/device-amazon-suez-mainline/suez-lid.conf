# The hall effect sensor for the magnetic folio cover is described as
# gpio-keys reporting SW_LID, and systemd-logind suspends on SW_LID by
# default. Suspend has never been exercised on this board, its reboot path
# already hangs mid-shutdown, and PSCI CPU_SUSPEND is what forced
# cpuidle.off=1 in the first place -- so closing the cover would very likely
# take the device away with no way back but the power button.
#
# Ignore the lid until suspend is actually shown to work. Screen blanking on
# cover close is a desktop-level policy and can be done without suspending.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
