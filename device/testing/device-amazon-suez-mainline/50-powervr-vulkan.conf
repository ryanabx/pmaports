# Mesa's PowerVR Vulkan driver identifies the GX6250 and then refuses it as a
# non-conformant implementation unless this variable is set. Every Wayland
# compositor here reaches the GPU through Vulkan -- their GLES comes from zink
# over Vulkan -- so without this the compositor falls back to llvmpipe,
# logging (mutter's wording) "Failed to initialize accelerated iGPU/dGPU
# framebuffer sharing: Not hardware accelerated". This is a conformance gate,
# not a capability check: with it set the desktop composites on the GPU
# (verified 2026-09-03 on GNOME).
#
# environment.d is read by the systemd *user* manager, so this covers
# compositors that run as user units -- gnome-shell (org.gnome.Shell@user
# .service under user@UID.service), the GDM greeter, and kwin under
# plasma-workspace-wayland.target.
#
# It does NOT cover compositors started as system services, which is how
# Plasma Mobile runs on postmarketOS: plasma-mobile.service is a system unit
# with User= set by a generator, and system units never read environment.d.
# suez-powervr-vulkan.conf sets the same variable via DefaultEnvironment= for
# that case. Both files are needed; keep them in sync.
PVR_I_WANT_A_BROKEN_VULKAN_DRIVER=1
