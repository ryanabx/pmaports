# Mesa's PowerVR Vulkan driver identifies the GX6250 and then refuses it as a
# non-conformant implementation unless this variable is set. gnome-shell
# needs Vulkan to render on the GPU at all (its GLES comes from zink over
# Vulkan), so without this the compositor falls back to llvmpipe, logging
# "Failed to initialize accelerated iGPU/dGPU framebuffer sharing: Not
# hardware accelerated". This is a conformance gate, not a capability check:
# with it set the desktop composites on the GPU (verified 2026-09-03).
#
# environment.d is read by the user manager, which is what starts gnome-shell
# (org.gnome.Shell@user.service under user@UID.service) and the GDM greeter.
PVR_I_WANT_A_BROKEN_VULKAN_DRIVER=1
