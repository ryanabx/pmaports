# Alpine's /usr/lib/sysctl.d/00-alpine.conf sets kernel.panic = 120, which
# silently overrides CONFIG_PANIC_TIMEOUT. Two minutes is a long time to sit
# on a dead kernel; the hardware watchdog would rescue it at 20 s anyway, so
# make the intended path win instead of the fallback.
kernel.panic = 10

# The buddy hard-lockup detector. It defaults off (nmi_watchdog reads 0 even
# with CONFIG_HARDLOCKUP_DETECTOR_BUDDY=y), and it is the only hard-lockup
# detector this board can ever have: MT8173 is GICv2, so there are no
# pseudo-NMIs and the perf-based detector always probes out with
# "NMI not fully supported". Also set on the cmdline, which lands earlier;
# this is here so it survives a boot where the cmdline gets rewritten.
kernel.nmi_watchdog = 1
