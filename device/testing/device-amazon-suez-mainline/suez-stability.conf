# Alpine's /usr/lib/sysctl.d/00-alpine.conf sets kernel.panic = 120, which
# silently overrides CONFIG_PANIC_TIMEOUT. Two minutes is a long time to sit
# on a dead kernel; the hardware watchdog would rescue it at 20 s anyway, so
# make the intended path win instead of the fallback.
kernel.panic = 10

# The buddy hard-lockup detector is NOT set here. Writing kernel.nmi_watchdog
# from sysctl.d looks like it works -- systemd-sysctl reports success -- but
# the detector stays off, and reading the file back does not reveal that
# because on read it reports the effective watchdog_enabled bit rather than
# the value written. See suez-hardlockup.service, which forces an explicit
# 0 -> 1 transition; that is what actually arms it.
