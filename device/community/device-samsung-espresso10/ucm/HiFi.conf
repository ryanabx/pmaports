SectionVerb {
	EnableSequence [
		cdev "hw:GalaxyTab2"

		# AIF1 -> DAC1
		cset "name='DAC1L Mixer AIF1.1 Switch' 1"
		cset "name='DAC1R Mixer AIF1.1 Switch' 1"
		cset "name='DAC1 Switch' 1"
		cset "name='AIF1DAC1 Volume' 96"
		cset "name='DAC1 Volume' 96"

		# DAC1 -> headphone (HPOUT1)
		cset "name='Left Headphone Mux' Mixer"
		cset "name='Right Headphone Mux' Mixer"
		cset "name='Left Output Mixer DAC Switch' 1"
		cset "name='Right Output Mixer DAC Switch' 1"

		# DAC1 -> SPKL/SPKR -> stereo speakers (SPKOUTL, SPKOUTR)
		cset "name='SPKL DAC1 Switch' 1"
		cset "name='SPKR DAC1 Switch' 1"
		cset "name='SPKL Boost SPKL Switch' 1"
		cset "name='SPKR Boost SPKR Switch' 1"
		cset "name='Speaker Mixer Volume' 3"

		# ADC -> AIF1
		cset "name='ADCL Mux' ADC"
		cset "name='ADCR Mux' ADC"
		cset "name='AIF1ADC1L Mixer ADC/DMIC Switch' 1"
		cset "name='AIF1ADC1R Mixer ADC/DMIC Switch' 1"
		cset "name='AIF1ADC1 Volume' 96"

		# Main mic on IN1L, headset mic on IN1R (differential)
		cset "name='IN1L PGA IN1LP Switch' 1"
		cset "name='IN1L PGA IN1LN Switch' 1"
		cset "name='IN1R PGA IN1RP Switch' 1"
		cset "name='IN1R PGA IN1RN Switch' 1"
		cset "name='IN1L Switch' 1"
		cset "name='IN1R Switch' 1"

		# Everything off by default
		cset "name='HP Switch' 0"
		cset "name='SPK Switch' 0"
		cset "name='RCV Switch' 0"
		cset "name='LINE Switch' 0"
		cset "name='Main Mic Switch' 0"
		cset "name='Headset Mic Switch' 0"
		cset "name='MIXINL IN1L Switch' 0"
		cset "name='MIXINR IN1R Switch' 0"

		cset "name='Headphone Volume' 40"
		cset "name='Speaker Volume' 40"
	]

	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SPK Switch' 1"
		cset "name='Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='SPK Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
		PlaybackChannels 2
		PlaybackVolume "Speaker Volume"
		PlaybackSwitch "Speaker Switch"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	# No jack detection yet (DET_3_5 on GPIO 0 is not described)
	EnableSequence [
		cset "name='HP Switch' 1"
		cset "name='Headphone Switch' 1"
	]

	DisableSequence [
		cset "name='HP Switch' 0"
	]

	Value {
		# Below the speakers until jack detection exists: without a
		# JackControl, PipeWire takes the headphones as always plugged in
		# and picks them over the speakers. Raise to 200 together with
		# JackControl "Headphone Jack".
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId}"
		PlaybackChannels 2
		PlaybackVolume "Headphone Volume"
		PlaybackSwitch "Headphone Switch"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='Main Mic Switch' 1"
		cset "name='MIXINL IN1L Switch' 1"
		# 0 dB in the input mixer (+30 dB clipped on normal speech, 2026-09-25)
		cset "name='MIXINL IN1L Volume' 0"
		cset "name='IN1L Volume' 31"
		# mono: both AIF1 ADC channels from the left ADC
		cset "name='AIF1ADCL Source' Left"
		cset "name='AIF1ADCR Source' Left"
	]

	DisableSequence [
		cset "name='Main Mic Switch' 0"
		cset "name='MIXINL IN1L Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId}"
		CaptureChannels 2
		CaptureVolume "IN1L Volume"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='Headset Mic Switch' 1"
		cset "name='MIXINR IN1R Switch' 1"
		# same gain as the internal mic (untested: no headset yet)
		cset "name='MIXINR IN1R Volume' 0"
		cset "name='IN1R Volume' 31"
		cset "name='AIF1ADCL Source' Right"
		cset "name='AIF1ADCR Source' Right"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' 0"
		cset "name='MIXINR IN1R Switch' 0"
	]

	Value {
		# below the internal mic until jack detection exists (see Headphones)
		CapturePriority 50
		CapturePCM "hw:${CardId}"
		CaptureChannels 2
		CaptureVolume "IN1R Volume"
	}
}
