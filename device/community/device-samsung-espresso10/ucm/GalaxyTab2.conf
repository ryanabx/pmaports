# Samsung Galaxy Tab 2 (espresso): WM1811 codec on McBSP3, sound card
# "GalaxyTab2" (kernel: sound/soc/ti/samsung-espresso.c). Based on the Midas
# UCM (device-samsung-m0).
# Tested on a 10.1" (GT-P5113): speakers (both channels, clean up to Speaker
# Volume 57 = 0 dB) and the internal microphone. Headphones and the headset
# microphone are untested and there is no jack detection yet, so they get a
# lower priority than the speakers and the internal microphone.

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Play high quality music"
}
